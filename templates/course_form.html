{% extends "base.html" %}

{% block title %}
  {% if course %}Edit Course{% else %}New Course{% endif %} – Course CMS
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>{% if course %}Edit Course{% else %}New Course{% endif %}</h1>
  <a href="{{ url_for('index') }}" class="btn btn-secondary">← Back</a>
</div>

<div class="form-card">
  <form method="post">
    <div class="form-group">
      <label for="title">Title <span class="required">*</span></label>
      <input
        id="title"
        name="title"
        type="text"
        class="form-control"
        placeholder="e.g. Introduction to Python"
        value="{{ course.title if course else '' }}"
        required
      />
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input
        id="category"
        name="category"
        type="text"
        class="form-control"
        placeholder="e.g. Programming, Design, Marketing"
        value="{{ course.category if course else '' }}"
      />
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea
        id="description"
        name="description"
        class="form-control"
        rows="4"
        placeholder="Brief description of the course content…"
      >{{ course.description if course else '' }}</textarea>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        {% if course %}Save Changes{% else %}Create Course{% endif %}
      </button>
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
